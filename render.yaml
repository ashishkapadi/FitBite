services:
  # ----------------------------------------------------------------------------
  # 1. FitBite Node.js / Express Core Commerce Backend & Real-Time Engine
  # ----------------------------------------------------------------------------
  - type: web
    name: fitbite-api
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        value: https://frontend-ashen-nine-e4ten1ains.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://frontend-ashen-nine-e4ten1ains.vercel.app,http://localhost:5173
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: ENABLE_LOCAL_JSON_FALLBACK
        value: "false"
      # Note: Render Free tier does not support private internal networking.
      # Set this to the public HTTPS URL assigned to fitbite-meal-planner (e.g. https://fitbite-meal-planner.onrender.com)
      - key: JAVA_MEAL_PLANNER_URL
        sync: false
      # Server-to-server shared secret to protect public Java planner non-health endpoints
      - key: PLANNER_SHARED_SECRET
        generateValue: true
      - key: STORAGE_PROVIDER
        value: local
      - key: PAYMENT_PROVIDER_MODE
        value: demo

  # ----------------------------------------------------------------------------
  # 2. FitBite Java / Spring Boot Meal Planner Microservice
  # ----------------------------------------------------------------------------
  - type: web
    name: fitbite-meal-planner
    runtime: docker
    rootDir: meal-planner-service
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8082
      - key: JAVA_OPTS
        value: "-Xmx384m -Xms128m"
      - key: FITBITE_PLANNER_RULES_ENABLED
        value: "true"
      # Copy the generated PLANNER_SHARED_SECRET from fitbite-api into this service's environment
      - key: PLANNER_SHARED_SECRET
        sync: false

